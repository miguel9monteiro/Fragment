<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Investment thesis slide placeholder">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0a1f3d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g font-family="Georgia, serif" fill="#ffffff">
    <text x="80" y="120" font-size="22" letter-spacing="3" fill="#b08d57">INVESTMENT THESIS</text>
    <text x="80" y="200" font-size="64" font-weight="600">Itron, Inc. (ITRI)</text>
    <text x="80" y="250" font-size="28" fill="#ffffff" opacity="0.7">Hidden software business priced as hardware</text>
  </g>
  <g font-family="Inter, sans-serif" fill="#ffffff" opacity="0.85">
    <text x="80" y="380" font-size="20" letter-spacing="2" fill="#b08d57">01</text>
    <text x="140" y="380" font-size="22">Switching-cost moat in regulated utility infrastructure</text>
    <text x="80" y="450" font-size="20" letter-spacing="2" fill="#b08d57">02</text>
    <text x="140" y="450" font-size="22">AMI 2.0 replacement cycle — non-discretionary spend</text>
    <text x="80" y="520" font-size="20" letter-spacing="2" fill="#b08d57">03</text>
    <text x="140" y="520" font-size="22">Recurring software revenue at 65% gross margin, ~30% of total</text>
    <text x="80" y="590" font-size="20" letter-spacing="2" fill="#b08d57">04</text>
    <text x="140" y="590" font-size="22">Trading at 8x EBITDA vs. peer SaaS averages of 18x</text>
  </g>
  <g font-family="JetBrains Mono, monospace" fill="#ffffff" opacity="0.5" font-size="13" letter-spacing="2">
    <text x="80" y="820">PMC · INVESTMENT TEAM 1 · SPRING 2026</text>
    <text x="1520" y="820" text-anchor="end">04 / 28</text>
  </g>
  <line x1="80" y1="700" x2="400" y2="700" stroke="#b08d57" stroke-width="2"/>
  <text x="80" y="740" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" opacity="0.5" letter-spacing="3">PORTFOLIO MANAGEMENT CLUB · NOVA SBE</text>
</svg>
